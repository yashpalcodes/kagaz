services:
  db:
    image: postgres:16
    container_name: kagaz-db
    environment:
      POSTGRES_USER: kagaz
      POSTGRES_PASSWORD: kagaz
      POSTGRES_DB: kagaz
    ports:
      - "5433:5432"
    volumes:
      - kagaz-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kagaz -d kagaz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kagaz-pgdata:
