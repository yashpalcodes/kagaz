# Central schemes: pensions and social security.
schemes:
  - id: central.ignoaps
    name: Indira Gandhi National Old Age Pension Scheme (NSAP)
    level: central
    category: pension
    description: >-
      Monthly pension for people aged 60 and above from BPL households. Central assistance is
      ₹200 per month at ages 60 to 79 and ₹500 at 80 and above. Many states add a top-up, so the
      final amount depends on the state.
    benefit_summary: Central assistance of ₹200 per month (60-79) or ₹500 per month (80+), plus state top-up
    nodal_agency: Ministry of Rural Development
    apply_portal: https://nsap.nic.in
    source_url: https://www.myscheme.gov.in/schemes/nsap-ignoaps
    last_verified: "2026-11-28"
    rule:
      all:
        - { field: age, op: gte, value: 60 }
        - { field: is_bpl_household, op: eq, value: true }
    documents:
      - [aadhaar]
      - [bank_account]
      - [ration_card]

  - id: central.atal_pension_yojana
    name: Atal Pension Yojana
    level: central
    category: pension
    description: >-
      Contributory pension for savings account holders aged 18 to 40. The subscriber pays a
      monthly amount until 60 and then receives a fixed pension. People who are or have been
      income tax payers cannot join (since 1 October 2022).
    benefit_summary: Guaranteed monthly pension of ₹1,000 to ₹5,000 from age 60, depending on contribution
    nodal_agency: Pension Fund Regulatory and Development Authority (PFRDA)
    source_url: https://www.pfrda.org.in/en/web/pfrda/schemes/atal-pension-yojana-apy
    last_verified: "2026-11-28"
    rule:
      all:
        - { field: age, op: gte, value: 18 }
        - { field: age, op: lte, value: 40 }
        - { field: has_bank_account, op: eq, value: true }
        - { field: pays_income_tax, op: eq, value: false }
    documents:
      - [aadhaar]
      - [bank_account]
